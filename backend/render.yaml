services:
  - type: web
    name: ims-vst-backend
    env: python
    buildCommand: pip install -r backend/requirements-deploy.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEPLOYMENT_MODE
        value: cloud
      - key: CORS_ORIGINS
        value: '["https://vst-ims.vercel.app", "http://localhost:5173", "http://localhost:3000"]'
      - key: CORS_ORIGIN_REGEX
        value: '^https:\/\/.*\.vercel\.app$|^http:\/\/localhost(:\d+)?$'
      - key: DATABASE_URL
        sync: false  # PASTE YOUR SUPABASE POSTGRESQL URL HERE (see below)
      - key: GEMINI_API_KEY
        sync: false  # Paste your Gemini API key in Render Dashboard
      - key: SECRET_KEY
        value: 'vst-prod-secret-key-2026-change-me'

# ──────────────────────────────────────────────────────────
# DATABASE_URL must start with postgresql:// (NOT postgres://)
# Format: postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
# Example: postgresql://postgres.izpdwqshdxvlkuveqqxx:Amruthkrishna123@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
# ──────────────────────────────────────────────────────────
