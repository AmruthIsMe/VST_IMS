services:
  - type: web
    name: ims-vst-backend
    env: python
    buildCommand: pip install -r backend/requirements-deploy.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEPLOYMENT_MODE
        value: cloud
      - key: DATABASE_URL
        sync: false  # Set this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: SECRET_KEY
        sync: false  # Set this manually in Render dashboard

